name: Go integration
on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'codex/go-vue-retirement']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ncs
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ncs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ncs -d ncs_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NCS_TEST_PG_DSN: postgres://ncs:ci-only-password@127.0.0.1:5432/ncs_test?sslmode=disable
      NCS_REDIS_TEST_ADDR: 127.0.0.1:6379
      NCS_REDIS_TEST_DB: '15'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - name: Install PostgreSQL 18 client and Redis CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common redis-tools nginx gettext-base openssl
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Repository checks
        run: ./scripts/check.sh
      - name: Nginx deployment drill
        run: backend/scripts/nginx-render.sh --drill
      - name: Real PostgreSQL and Redis tests (no skipped tests)
        run: ./scripts/test-backend.sh
      - name: Four-process charging closed loop
        env:
          NCS_POSTGRES_DSN: postgres://ncs:ci-only-password@127.0.0.1:5432/ncs_e2e_test?sslmode=disable
          NCS_REDIS_ADDR: 127.0.0.1:6379
          NCS_REDIS_DB: '14'
          NCS_E2E_ALLOW_DESTRUCTIVE: 'true'
        run: |
          psql "$NCS_TEST_PG_DSN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ncs_e2e_test'
          set -o pipefail
          backend/scripts/verify-closed-loop.sh 2>&1 | tee closed-loop.log
      - name: PostgreSQL backup and restore drill
        run: |
          set -o pipefail
          backend/scripts/drill-backup-restore.sh 2>&1 | tee backup-restore.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-integration-evidence
          path: |
            backend/go-tests.jsonl
            closed-loop.log
            backup-restore.log
  go-windows-build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - run: go build ./...
        working-directory: backend
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-test-results
          path: apps/dashboard/test-results/

  deployment-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Validate the complete compose model
        working-directory: backend/deploy
        run: |
          cp .env.example .env
          docker compose --profile mock --profile dashboard config --quiet
      - name: Build and start the deployable stack
        working-directory: backend/deploy
        run: docker compose --profile mock up --detach --build --wait
      - name: Verify both active Web entry points
        working-directory: backend/deploy
        run: |
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8088/healthz
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8089/healthz
          docker compose exec -T api wget -q -O /dev/null http://127.0.0.1:8080/readyz
      - name: Capture compose state
        if: always()
        working-directory: backend/deploy
        run: docker compose --profile mock ps && docker compose --profile mock logs --no-color --tail 100
      - name: Stop the disposable stack
        if: always()
        working-directory: backend/deploy
        run: docker compose --profile mock down --volumes --remove-orphans
