# NCS Go/Vue 单机编排
#
# 用途：一键起 PostgreSQL、Redis、Go API、Publisher 和两个 Web 客户端。
#       mock profile 增加 Worker 与模拟设备；dashboard profile 增加尚待 Go 契约迁移的大屏。
#       Web 端口默认只绑定 127.0.0.1，公网部署必须再接 TLS 入口。
#
# 用法：
#   cd backend/deploy
#   cp .env.example .env    # 填数据库口令与 NCS_CHARGER_GATEWAY_TOKEN
#   docker compose up -d
#   docker compose --profile mock up -d  # 增加完整模拟充电闭环
#
# 迁移：api 容器启动时由进程内的迁移 runner 执行（0001..0012），无需手工 psql。

name: ncs-backend

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NCS_DB_USER:-ncs}
      POSTGRES_PASSWORD: ${NCS_DB_PASSWORD:?set NCS_DB_PASSWORD}
      POSTGRES_DB: ${NCS_DB_NAME:-ncs_dev}
    volumes:
      # PostgreSQL 18 stores clusters under a versioned subdirectory. Mount the
      # parent so pg_upgrade can link across versions without a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NCS_DB_USER:-ncs} -d ${NCS_DB_NAME:-ncs_dev}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 数据库不对外暴露端口：只有同网络的进程可以访问（架构文档第 7 节安全边界）。
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "6379"

  # 迁移门禁：先应用顺序迁移并核对版本，成功退出后 API / Worker / Publisher 才启动。
  migrate:
    image: ${NCS_IMAGE_REGISTRY:-ghcr.io}/${NCS_IMAGE_OWNER:-cjyhjy}/ncs-api:${NCS_IMAGE_TAG:-retirement}
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile
      args:
        NCS_TARGET: cmd/api
    restart: "no"
    environment:
      NCS_POSTGRES_DSN: postgres://${NCS_DB_USER:-ncs}:${NCS_DB_PASSWORD}@postgres:5432/${NCS_DB_NAME:-ncs_dev}?sslmode=disable
      NCS_CHARGER_GATEWAY_TOKEN: ${NCS_CHARGER_GATEWAY_TOKEN:?set NCS_CHARGER_GATEWAY_TOKEN}
      NCS_MIGRATE_ONLY: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${NCS_IMAGE_REGISTRY:-ghcr.io}/${NCS_IMAGE_OWNER:-cjyhjy}/ncs-api:${NCS_IMAGE_TAG:-retirement}
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile
      args:
        NCS_TARGET: cmd/api
    restart: unless-stopped
    environment:
      NCS_POSTGRES_DSN: postgres://${NCS_DB_USER:-ncs}:${NCS_DB_PASSWORD}@postgres:5432/${NCS_DB_NAME:-ncs_dev}?sslmode=disable
      NCS_REDIS_ADDR: redis:6379
      NCS_REDIS_REQUIRED: "true"
      NCS_CHARGER_GATEWAY_TOKEN: ${NCS_CHARGER_GATEWAY_TOKEN:?set NCS_CHARGER_GATEWAY_TOKEN}
      NCS_HTTP_ADDR: 0.0.0.0:8080
      NCS_ENV: ${NCS_ENV:-development}
      NCS_SMS_MOCK: ${NCS_SMS_MOCK:-true}
      NCS_SMS_SENDER_URL: ${NCS_SMS_SENDER_URL:-}
      NCS_SMS_SENDER_TOKEN: ${NCS_SMS_SENDER_TOKEN:-}
      TENCENT_MAP_SERVER_KEY: ${TENCENT_MAP_SERVER_KEY:-}
      TENCENT_MAP_BASE_URL: ${TENCENT_MAP_BASE_URL:-https://apis.map.qq.com}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-15000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # 运行时镜像用 alpine（含 busybox wget）；若改用 distroless 静态镜像，容器内没有 shell，
      # 健康检查只能由编排平台按 HTTP 探针执行（见 deploy/README.md 的两种运行方式说明）。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    expose:
      - "8080"

  worker:
    profiles: ["mock", "worker"]
    image: ${NCS_IMAGE_REGISTRY:-ghcr.io}/${NCS_IMAGE_OWNER:-cjyhjy}/ncs-worker:${NCS_IMAGE_TAG:-retirement}
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile
      args:
        NCS_TARGET: cmd/worker
    restart: unless-stopped
    environment:
      NCS_POSTGRES_DSN: postgres://${NCS_DB_USER:-ncs}:${NCS_DB_PASSWORD}@postgres:5432/${NCS_DB_NAME:-ncs_dev}?sslmode=disable
      NCS_REDIS_ADDR: redis:6379
      NCS_REDIS_REQUIRED: "true"
      NCS_CHARGER_GATEWAY_URL: ${NCS_CHARGER_GATEWAY_URL:?set NCS_CHARGER_GATEWAY_URL}
      NCS_CHARGER_GATEWAY_TIMEOUT: 5s
      NCS_WORKER_CONSUMER: worker-compose
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  outbox-publisher:
    image: ${NCS_IMAGE_REGISTRY:-ghcr.io}/${NCS_IMAGE_OWNER:-cjyhjy}/ncs-outbox-publisher:${NCS_IMAGE_TAG:-retirement}
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile
      args:
        NCS_TARGET: cmd/outbox-publisher
    restart: unless-stopped
    environment:
      NCS_POSTGRES_DSN: postgres://${NCS_DB_USER:-ncs}:${NCS_DB_PASSWORD}@postgres:5432/${NCS_DB_NAME:-ncs_dev}?sslmode=disable
      NCS_REDIS_ADDR: redis:6379
      NCS_REDIS_REQUIRED: "true"
      NCS_OUTBOX_INTERVAL: 500ms
      NCS_OUTBOX_BATCH: 100
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  mock-gateway:
    profiles: ["mock"]
    image: ${NCS_IMAGE_REGISTRY:-ghcr.io}/${NCS_IMAGE_OWNER:-cjyhjy}/ncs-mock-gateway:${NCS_IMAGE_TAG:-retirement}
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile
      args:
        NCS_TARGET: cmd/mock-gateway
    restart: unless-stopped
    environment:
      NCS_MOCK_GATEWAY_ADDR: 0.0.0.0:8090
      NCS_MOCK_GATEWAY_RECEIPTS: ${NCS_MOCK_GATEWAY_RECEIPTS:-true}
      NCS_MOCK_GATEWAY_API_URL: http://api:8080
      NCS_CHARGER_GATEWAY_TOKEN: ${NCS_CHARGER_GATEWAY_TOKEN:?set NCS_CHARGER_GATEWAY_TOKEN}
      NCS_MOCK_GATEWAY_ENERGY_WH: ${NCS_MOCK_GATEWAY_ENERGY_WH:-1000}
      NCS_MOCK_GATEWAY_METER_INTERVAL: ${NCS_MOCK_GATEWAY_METER_INTERVAL:-3s}
      NCS_MOCK_GATEWAY_CHARGE_SECONDS: ${NCS_MOCK_GATEWAY_CHARGE_SECONDS:-60}
    expose:
      - "8090"

  user-web:
    image: ${NCS_IMAGE_REGISTRY:-ghcr.io}/${NCS_IMAGE_OWNER:-cjyhjy}/ncs-user-web:${NCS_IMAGE_TAG:-retirement}
    build:
      context: ../..
      dockerfile: backend/deploy/Web.Dockerfile
      args:
        NCS_WEB_APP: user
    restart: unless-stopped
    ports:
      - "${NCS_BIND_ADDRESS:-127.0.0.1}:${NCS_USER_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy

  admin-web:
    image: ${NCS_IMAGE_REGISTRY:-ghcr.io}/${NCS_IMAGE_OWNER:-cjyhjy}/ncs-admin-web:${NCS_IMAGE_TAG:-retirement}
    build:
      context: ../..
      dockerfile: backend/deploy/Web.Dockerfile
      args:
        NCS_WEB_APP: admin
    restart: unless-stopped
    ports:
      - "${NCS_BIND_ADDRESS:-127.0.0.1}:${NCS_ADMIN_PORT:-8089}:80"
    depends_on:
      api:
        condition: service_healthy

  dashboard-web:
    profiles: ["dashboard"]
    image: ${NCS_IMAGE_REGISTRY:-ghcr.io}/${NCS_IMAGE_OWNER:-cjyhjy}/ncs-dashboard-web:${NCS_IMAGE_TAG:-retirement}
    build:
      context: ../..
      dockerfile: backend/deploy/Web.Dockerfile
      args:
        NCS_WEB_APP: dashboard
    restart: unless-stopped
    ports:
      - "${NCS_BIND_ADDRESS:-127.0.0.1}:${NCS_DASHBOARD_PORT:-8091}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
